# Commits coordinated metadata only. Run Build separately on the resulting commit.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: require a selected branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::Select a branch to bump, not a tag."
            exit 1
          fi

      - name: checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: validate and bump coordinated metadata
        id: bump
        env:
          BUMP_MODE: ${{ inputs.mode }}
        run: python3 .github/scripts/release.py bump "$BUMP_MODE"

      - name: commit and push only the selected branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "msoffice crypt.xcodeproj/project.pbxproj" Info.plist English.lproj/InfoPlist.strings
          git commit -m "chore: bump version to ${VERSION}"
          git -c push.followTags=false push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          {
            echo "### Version metadata bumped to v${VERSION}"
            echo "Committed $(git rev-parse HEAD) to branch ${GITHUB_REF_NAME}."
            echo "No tag or release was created. Run Build separately on this branch to publish this version."
          } >> "$GITHUB_STEP_SUMMARY"
